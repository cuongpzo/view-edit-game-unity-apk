[package]
name = "l10n-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "l10n-cli"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
calamine = "0.38"
getrandom = "0.2"
pbkdf2 = "0.12"
sha2 = "0.10"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
lzma-rs = "0.3"
regex = "1"
rust_xlsxwriter = "0.79"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
