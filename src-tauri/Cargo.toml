[package]
name = "unity-l10n-gui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
l10n-core = { path = "../core" }
l10n-assets = { path = "../assets" }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
